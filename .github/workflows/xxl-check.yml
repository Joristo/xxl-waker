name: Voorraadcheck shirts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      testmelding:
        description: "Alleen een testmelding sturen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: voorraadcheck

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voorraad checken
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TESTMELDING: ${{ inputs.testmelding }}
        run: python check_xxl.py
      - name: Status opslaan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Voorraadstatus bijgewerkt" && git push)
