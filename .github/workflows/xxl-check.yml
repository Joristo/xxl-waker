name: XXL voorraadcheck

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SIZE: XXL
        run: python check_xxl.py
      - name: Stop met checken na melding
        if: steps.check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
